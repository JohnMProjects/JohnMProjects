        <div class="faq">
          <p class="eyebrow">FAQ</p>
          <h2>Before you reach out</h2>
          <div class="faq-item">
            <h3>What does off-page SEO actually cover?</h3>
            <p>The signals that live off your own site: earned backlinks, referring-domain growth, digital PR, directory and citation listings, and brand mentions. It is the reputation the rest of the web confers on you, and a big part of how Google and AI systems decide whether to trust and rank you.</p>
          </div>
          <div class="faq-item">
            <h3>How is off-page different from on-page, and do I need both?</h3>
            <p>On-page is what sits on your pages: content, titles, structure, internal links. Off-page is what others say about you, mainly links and mentions. You need both, on-page makes a page worth ranking, off-page gives it the authority to actually rank. I specialize in off-page and brief the on-page side so the two pull together.</p>
          </div>
          <div class="faq-item">
            <h3>How long until I see results?</h3>
            <p>Not overnight. Expect early movement on referring domains and rankings within the first weeks to a couple of months, and meaningful compounding by month three to six. Anyone promising first-month organic results is overselling. Authority is earned steadily.</p>
          </div>
          <div class="faq-item">
            <h3>Do you work solo, or embedded in my team or agency?</h3>
            <p>Both. I have run solo engagements owning link building end to end, and worked inside a delivery team for an agency on rotating client work. I can plug into your team, take the off-page workstream off your plate, or run a defined campaign.</p>
          </div>
          <div class="faq-item">
            <h3>How do I know your numbers are not inflated?</h3>
            <p>Because I report only what I can defend. Every figure is filtered to the engagement window, sister-site cross-links are stripped, low-value and auto-generated links are set aside, and Domain Rating is marked approximate. Where a lane did not work, I say so. You will see numbers I can back with exports, not headlines I cannot.</p>
          </div>
          <div class="faq-item">
            <h3>Why a specialist instead of leaving links to a generalist agency?</h3>
            <p>Off-page is the part most generalists do worst, buying cheap links or chasing volume that gets devalued later. A specialist earns editorial links that survive algorithm updates, vets every placement, and reports honestly. It is the difference between authority that lasts and links you have to disavow next year.</p>
          </div>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var status = document.getElementById('form-status');
      if (!form) return;
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        status.className = '';
        status.textContent = 'Sending...';
        try {
          var res = await fetch(form.action, { method: 'POST', body: new FormData(form),
            headers: { 'Accept': 'application/json' } });
          var data = await res.json();
          if (res.ok) {
            form.reset();
            status.className = 'ok';
            status.textContent = 'Thanks. Your message is in, I\u2019ll be in touch soon.';
          } else {
            status.className = 'err';
            status.textContent = data.message || 'Something went wrong. Please try again.';
          }
        } catch (err) {
          status.className = 'err';
          status.textContent = 'Network error. Please try again in a moment.';
        }
      });
    })();
  </script>
